<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/jpeg" href="/maman_emblem.jpg" />
    <link rel="apple-touch-icon" href="/maman_emblem.jpg" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Primary SEO Metadata -->
    <title>MAMAN+ — Suivi de grossesse et conseils pour futures mamans</title>
    <meta
      name="description"
      content="MAMAN+ est une application dédiée au suivi de grossesse, au bien-être de la future maman et à la préparation de l'arrivée de bébé. Suivez votre grossesse, vos rendez-vous, vos symptômes, vos examens, votre poids, votre calendrier et retrouvez des conseils et ressources utiles."
    />
    <meta
      name="keywords"
      content="suivi de grossesse, maternité, future maman, carnet de maternité, calendrier grossesse, santé prénatale, symptômes grossesse, bébé"
    />
    <meta name="robots" content="index,follow,max-image-preview:large,max-snippet:-1" />
    <meta name="theme-color" content="#9E2A2B" />

    <!-- Open Graph / Facebook / LinkedIn / WhatsApp -->
    <meta property="og:site_name" content="MAMAN+" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="MAMAN+ — Suivi de grossesse et conseils pour futures mamans" />
    <meta
      property="og:description"
      content="MAMAN+ est une application dédiée au suivi de grossesse, au bien-être de la future maman et à la préparation de l'arrivée de bébé. Suivez votre grossesse, vos rendez-vous, vos symptômes, vos examens, votre poids, votre calendrier et retrouvez des conseils et ressources utiles."
    />
    <meta property="og:image" content="/pregnant_mother_illustration.jpg" />
    <meta property="og:image:alt" content="MAMAN+ — Plateforme de suivi de maternité et bien-être prénatal" />
    <meta property="og:locale" content="fr_FR" />

    <!-- Twitter / X Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MAMAN+ — Suivi de grossesse et conseils pour futures mamans" />
    <meta
      name="twitter:description"
      content="MAMAN+ est une application dédiée au suivi de grossesse, au bien-être de la future maman et à la préparation de l'arrivée de bébé."
    />
    <meta name="twitter:image" content="/pregnant_mother_illustration.jpg" />

    <!-- Google Structured Data (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "name": "MAMAN+",
          "description": "Application dédiée au suivi de grossesse, au bien-être de la future maman et à la préparation de l'arrivée de bébé.",
          "inLanguage": "fr-FR"
        },
        {
          "@type": "WebApplication",
          "name": "MAMAN+ Maternité & Santé",
          "applicationCategory": "HealthApplication",
          "operatingSystem": "All",
          "description": "Application de suivi de grossesse gratuit et sécurisé pour futures mamans.",
          "offers": {
            "@type": "Offer",
            "price": "0",
            "priceCurrency": "XAF"
          }
        }
      ]
    }
    </script>

    <!-- Typography Fonts preconnect for optimal performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-[#F8F7F4] text-[#2C2825] font-sans antialiased selection:bg-[#9E2A2B]/15 selection:text-[#9E2A2B]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
